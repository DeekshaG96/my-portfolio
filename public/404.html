<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Deeksha G</title>
    <meta name="theme-color" content="#080808" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #080808;
        color: #fff;
        font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }
      .ambient-glow {
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 0, 79, 0.15) 0%, rgba(8, 8, 8, 0) 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .card {
        background: rgba(24, 24, 24, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        padding: 48px 36px;
        border-radius: 20px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        position: relative;
        z-index: 10;
      }
      .logo {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 24px;
        display: inline-block;
      }
      .logo span {
        color: #ff004f;
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        background: rgba(255, 0, 79, 0.12);
        color: #ff004f;
        border: 1px solid rgba(255, 0, 79, 0.3);
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 18px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      h1 {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #ffffff;
      }
      p {
        color: #ababab;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 28px;
        background: transparent;
        color: #ffffff;
        border: 2px solid #ff004f;
        border-radius: 10px;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .btn:hover {
        background: #ff004f;
        color: #ffffff;
        box-shadow: 0 10px 25px rgba(255, 0, 79, 0.4);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="ambient-glow"></div>
    <div class="card">
      <div class="logo">Deeksha<span>.</span></div>
      <div><span class="badge">Error 404</span></div>
      <h1>Page Not Found</h1>
      <p>The page or resource you are looking for does not exist or has been moved.</p>
      <a href="/" class="btn">
        Return to Portfolio &rarr;
      </a>
    </div>
  </body>
</html>
