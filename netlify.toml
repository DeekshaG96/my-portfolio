[build]
  publish = "dist"
  command = "npm run build"

# SPA fallback rule for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Global Production Security & Privacy Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Freshness header for index.html to guarantee immediate updates
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-term immutable caching for Vite hashed production assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hand-managed images keep stable filenames, so they must revalidate.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Professional delivery header for the PDF Resume
[[headers]]
  for = "/Deeksha_G_Resume.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Disposition = "inline; filename=\"Deeksha_G_Resume.pdf\""
